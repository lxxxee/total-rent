name: Build PoodPim APK

on:
  push:
    branches: [poodpim-build]
    paths:
      - 'poodpim/source.part*.b64'
      - '.github/workflows/poodpim-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Recreate source zip
        run: |
          cat poodpim/source.part00.b64 poodpim/source.part01.b64 poodpim/source.part02.b64 poodpim/source.part03.b64 poodpim/source.part04.b64 > /tmp/poodpim.b64
          base64 -d /tmp/poodpim.b64 > /tmp/PoodPim-Android-2.1.1-min.zip
          mkdir -p /tmp/poodpim-src
          unzip -q /tmp/PoodPim-Android-2.1.1-min.zip -d /tmp/poodpim-src
          test -f /tmp/poodpim-src/app/build.gradle.kts

      - name: Align Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/poodpim-src/app/build.gradle.kts')
          s = p.read_text()
          if 'compileOptions {' not in s:
              s = s.replace('    compileSdk = 35\n', '    compileSdk = 35\n\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n', 1)
          s = s.replace('versionCode = 3', 'versionCode = 4')
          s = s.replace('versionName = "2.1.0"', 'versionName = "2.1.2"')
          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: /tmp/poodpim-src
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: /tmp/poodpim-src
        run: gradle --no-daemon assembleDebug

      - name: Prepare artifact
        run: |
          test -f /tmp/poodpim-src/app/build/outputs/apk/debug/app-debug.apk
          cp /tmp/poodpim-src/app/build/outputs/apk/debug/app-debug.apk /tmp/PoodPim-Next-2.1.2-voice-fix.apk
          sha256sum /tmp/PoodPim-Next-2.1.2-voice-fix.apk > /tmp/PoodPim-Next-2.1.2-voice-fix.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PoodPim-Next-2.1.2-APK
          path: |
            /tmp/PoodPim-Next-2.1.2-voice-fix.apk
            /tmp/PoodPim-Next-2.1.2-voice-fix.apk.sha256
          if-no-files-found: error
          retention-days: 7
