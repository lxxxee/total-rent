name: Queue rental intake

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  queue:
    if: contains(github.event.issue.labels.*.name, 'rental-inbox')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse into pending review queue
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/import-inbox.mjs
      - name: Validate and test
        run: |
          npm run validate:data
          npm test
      - name: Create review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if git diff --quiet; then
            echo "Issue is already queued; no pull request required."
            exit 0
          fi
          branch="spark/rental-inbox-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/pending-changes.json
          git commit -m "Queue rental intake #${ISSUE_NUMBER} for Codex review"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Review rental intake #${ISSUE_NUMBER}" --body "Queues #${ISSUE_NUMBER} for Codex validation. This pull request does not modify approved rental data."
