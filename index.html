<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071018">
  <meta name="description" content="Private vehicle rental earnings ledger">
  <link rel="icon" href="data:,">
  <title>Total Rent</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="hero">
      <div>
        <p class="eyebrow">PRIVATE RENTAL LEDGER</p>
        <h1>Total Rent</h1>
        <p id="updated" class="muted">Loading approved records…</p>
      </div>
      <div class="hero-actions">
        <span class="live"><i></i> SECURE</span>
        <button class="primary" id="add-rental" type="button">+ Add rental</button>
      </div>
    </header>

    <section class="stats" id="stats" aria-label="Rental totals"></section>

    <section class="workspace">
      <div class="section-title">
        <div><p class="eyebrow">TIMELINE</p><h2>Rental sessions</h2></div>
        <div class="filters">
          <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search plate" aria-label="Search by plate"></label>
          <select id="status-filter" aria-label="Filter by review status">
            <option value="all">All status</option>
            <option value="approved">Approved</option>
            <option value="review">Needs Review</option>
          </select>
        </div>
      </div>
      <div class="timeline" id="rentals"></div>
      <p class="empty" id="empty" hidden>No rental sessions match this filter.</p>
    </section>
  </main>

  <dialog id="rental-dialog">
    <form id="rental-form" method="dialog">
      <div class="dialog-head"><div><p class="eyebrow">CODEX REVIEW QUEUE</p><h2 id="dialog-title">Add rental</h2></div><button class="icon-button" value="cancel" aria-label="Close">×</button></div>
      <input id="request-type" type="hidden" value="add">
      <div class="form-grid">
        <label>Plate<input id="form-plate" required placeholder="VHH1234"></label>
        <label>Vehicle cost (RM)<input id="form-cost" type="number" min="0" step="0.01" placeholder="2000"></label>
        <label>Start date<input id="form-start" type="date" required></label>
        <label>End date<input id="form-end" type="date" required></label>
      </div>
      <label>Pay / Get Back items<textarea id="form-items" rows="6" required placeholder="Pay RM 105 Get Back RM 170&#10;Pay RM 65 Get Back RM 170"></textarea></label>
      <label>Notes<textarea id="form-notes" rows="3" placeholder="Optional reported totals or context"></textarea></label>
      <p class="form-note">Submitting opens a private GitHub intake issue. Codex validates it before approved financial data changes.</p>
      <div class="dialog-actions"><button class="secondary" value="cancel">Cancel</button><button class="primary" id="submit-request" type="submit">Create review request</button></div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
